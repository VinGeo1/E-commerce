name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '414100287492' }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID || '414100287492' }}.dkr.ecr.${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}.amazonaws.com
  ECS_CLUSTER: ecommerce-cluster

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate config
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          missing=""
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION AWS_ACCOUNT_ID; do
            # bash indirect expansion: ${!v} is the value of the variable named $v
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required CI configuration:$missing (secrets in Settings > Secrets and variables > Actions, variables in the same place)"
            exit 1
          fi
          echo "All required config present."

  build-and-push-backend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/ecommerce-backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/ecommerce-backend:latest

  build-and-push-frontend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/ecommerce-frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/ecommerce-frontend:latest

  # The two deploy jobs share scripts/ecs-deploy.sh: it copies the service's current
  # task definition, swaps the image on the named container, registers a new revision
  # built from only the arguments RegisterTaskDefinition accepts, and fails with a
  # check annotation that says *why* (missing service, inactive cluster, IAM, ...).
  #
  # IMAGE is built from the workflow-level ECR_REGISTRY (the build jobs expose no
  # outputs; the previous `needs.<job>.outputs.registry` expanded to "" and produced
  # "/ecommerce-backend:<sha>"). ECS_CLUSTER also comes from the workflow env.
  #
  # WAIT_FOR_STABLE makes "green pipeline, 0 running tasks" impossible: the job only
  # passes once the service reports steady state, and a failed rollout is followed by
  # scripts/ecs-diagnose.sh (read-only) printing capacity / stopped-task / target health.
  deploy-backend:
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deploys on every push to main; manual runs also deploy (from whatever ref
    # they were dispatched on) so a deploy can be triggered without merging first.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Update ECS service
        env:
          ECS_SERVICE: backend-service
          CONTAINER_NAME: backend
          IMAGE: ${{ env.ECR_REGISTRY }}/ecommerce-backend:${{ github.sha }}
          # Fail the job unless the task actually reaches steady state: "registered a
          # new revision" is not the same as "the service is running it".
          WAIT_FOR_STABLE: 1
        run: sh scripts/ecs-deploy.sh

      # Only on failure, and only reads: prints cluster capacity, stopped-task
      # reasons and ALB target health so the log says *why* nothing is running.
      - name: Triage (read-only)
        if: failure()
        run: sh scripts/ecs-diagnose.sh backend-service

  deploy-frontend:
    needs: build-and-push-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Update ECS service
        env:
          ECS_SERVICE: frontend-service
          CONTAINER_NAME: frontend
          IMAGE: ${{ env.ECR_REGISTRY }}/ecommerce-frontend:${{ github.sha }}
          WAIT_FOR_STABLE: 1
        run: sh scripts/ecs-deploy.sh

      - name: Triage (read-only)
        if: failure()
        run: sh scripts/ecs-diagnose.sh frontend-service
