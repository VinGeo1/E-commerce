name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validate required variables
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "MISSING: AWS_ACCOUNT_ID"; exit 1; fi
          if [ -z "$AWS_DEFAULT_REGION" ]; then echo "MISSING: AWS_DEFAULT_REGION"; exit 1; fi
          if [ -z "$ALB_DNS" ]; then echo "MISSING: ALB_DNS"; exit 1; fi
          echo "All required CI variables present."

  build-and-push-backend:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/ecommerce-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/ecommerce-backend:latest

  build-and-push-frontend:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/ecommerce-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/ecommerce-frontend:latest

  deploy-backend:
    needs: [build-and-push-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy backend service
        env:
          ECS_CLUSTER: ecommerce-cluster
          ECS_SERVICE: backend-service
          IMAGE: ${{ needs.build-and-push-backend.outputs.registry }}/ecommerce-backend:${{ github.sha }}
        run: |
          if [ -z "$ECS_SERVICE" ]; then echo "MISSING: ECS_SERVICE"; exit 1; fi
          if [ -z "$IMAGE" ]; then echo "MISSING: IMAGE"; exit 1; fi
          echo "Looking up task definition for $ECS_SERVICE in $ECS_CLUSTER..."
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          if [ -z "$TASK_DEF_ARN" ]; then echo "ERROR: empty task def ARN"; exit 1; fi
          if [ "$TASK_DEF_ARN" = "None" ]; then echo "ERROR: service $ECS_SERVICE not found — run terraform apply first"; exit 1; fi
          echo "Current task def: $TASK_DEF_ARN"
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" --query 'taskDefinition' --output json > /tmp/td.json
          jq --arg IMG "$IMAGE" '.containerDefinitions[0].image = $IMG | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' /tmp/td.json > /tmp/td-new.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task def: $NEW_ARN"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_ARN" --force-new-deployment > /dev/null
          echo "Rollout triggered for $ECS_SERVICE"

  deploy-frontend:
    needs: [build-and-push-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy frontend service
        env:
          ECS_CLUSTER: ecommerce-cluster
          ECS_SERVICE: frontend-service
          IMAGE: ${{ needs.build-and-push-frontend.outputs.registry }}/ecommerce-frontend:${{ github.sha }}
        run: |
          if [ -z "$ECS_SERVICE" ]; then echo "MISSING: ECS_SERVICE"; exit 1; fi
          if [ -z "$IMAGE" ]; then echo "MISSING: IMAGE"; exit 1; fi
          echo "Looking up task definition for $ECS_SERVICE in $ECS_CLUSTER..."
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          if [ -z "$TASK_DEF_ARN" ]; then echo "ERROR: empty task def ARN"; exit 1; fi
          if [ "$TASK_DEF_ARN" = "None" ]; then echo "ERROR: service $ECS_SERVICE not found — run terraform apply first"; exit 1; fi
          echo "Current task def: $TASK_DEF_ARN"
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" --query 'taskDefinition' --output json > /tmp/td.json
          jq --arg IMG "$IMAGE" '.containerDefinitions[0].image = $IMG | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' /tmp/td.json > /tmp/td-new.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "New task def: $NEW_ARN"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_ARN" --force-new-deployment > /dev/null
          echo "Rollout triggered for $ECS_SERVICE"
