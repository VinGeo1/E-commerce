name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      db_password:
        description: 'Postgres password. Leave empty to use the DB_PASSWORD repository secret.'
        required: false
        type: string
      confirmation:
        description: 'Type DESTROY to confirm destroy'
        required: false
        type: string

permissions:
  contents: read

# State now lives in S3 behind a DynamoDB lock: a second apply would only queue up
# behind that lock anyway, and cancelling a half-finished apply/destroy is how state
# gets corrupted. Serialise runs instead of cancelling them.
concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_STATE_BUCKET: ecommerce-tfstate-414100287492

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refuse destroy without confirmation
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirmation != 'DESTROY'
        run: |
          echo "ERROR: You must type DESTROY in the confirmation field to run destroy mode."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # db_password was a dispatch-only input before, so it landed in the runner
      # environment and on the terraform command line. Preferred setup: store it as
      # the DB_PASSWORD repository secret and leave the input empty.
      - name: Validate required config
        env:
          TF_VAR_db_password: ${{ github.event.inputs.db_password != '' && github.event.inputs.db_password || secrets.DB_PASSWORD }}
        run: |
          set -e
          missing=""
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || missing="$missing AWS_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || missing="$missing AWS_SECRET_ACCESS_KEY"
          # -input=false turns an unset required variable into a confusing mid-plan
          # "no value included for a required variable" error; catch it up front.
          [ -n "${TF_VAR_db_password:-}" ] || missing="$missing db_password(input or DB_PASSWORD secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required CI configuration:$missing"
            exit 1
          fi
          # Fail here rather than 30s later inside `terraform init`, whose backend
          # error is easy to misread. A 403 (key without s3:ListBucket) is only a
          # warning: init can still work with object-level permissions.
          head_out=$(aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>&1) || {
            case "$head_out" in
              *NotFound*|*NoSuchBucket*)
                echo "::error::State bucket $TF_STATE_BUCKET does not exist - create it first (README: Terraform state)."
                exit 1
                ;;
              *)
                echo "::warning::could not verify $TF_STATE_BUCKET: $head_out"
                ;;
            esac
          }
          echo "AWS credentials, state bucket and db password look OK."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init -input=false

      - name: Terraform Format
        working-directory: infrastructure
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: infrastructure
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action != 'destroy'
        working-directory: infrastructure
        env:
          TF_VAR_db_password: ${{ github.event.inputs.db_password != '' && github.event.inputs.db_password || secrets.DB_PASSWORD }}
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: infrastructure
        env:
          TF_VAR_db_password: ${{ github.event.inputs.db_password != '' && github.event.inputs.db_password || secrets.DB_PASSWORD }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: infrastructure
        env:
          TF_VAR_db_password: ${{ github.event.inputs.db_password != '' && github.event.inputs.db_password || secrets.DB_PASSWORD }}
        run: terraform destroy -input=false -auto-approve

      - name: Outputs
        if: github.event.inputs.action == 'apply'
        working-directory: infrastructure
        run: |
          echo "=== Terraform Outputs ==="
          terraform output
          ALB_DNS=$(terraform output -raw alb_dns 2>/dev/null || echo "unavailable")
          echo "App URL: http://${ALB_DNS}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::App URL http://${ALB_DNS} - re-run the CI workflow to pin the services to the latest images"
