# Datasource is injected by the ECS task definition (see infrastructure/ecs.tf);
# the defaults below only matter for `mvn spring-boot:run` against a local Postgres.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dbadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Everything is served under /api, which is also the ALB path pattern that routes
# to the backend target group (infrastructure/alb.tf).
server.port=${PORT:8080}
server.servlet.context-path=/api

# /actuator/health (i.e. /api/actuator/health from outside the container) is what
# keeps the ECS task registered as a healthy ALB target.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# HS256 signing key; must be at least 32 characters. Override in the task def.
app.jwt.secret=${JWT_SECRET:change-me-ecommerce-dev-secret-0123456789abcdef}
app.jwt.ttl-minutes=720

logging.level.org.springframework.security=WARN
